name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project SynergyCrew.xcodeproj \
            -scheme SynergyCrew \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r ./build/Build/Products/Release-iphoneos/SynergyCrew.app Payload/
          zip -r SynergyCrew.ipa Payload
          ls -la SynergyCrew.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynergyCrew-ipa
          path: SynergyCrew.ipa

      - name: Publish release (tag latest)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Synergy Crew (unsigned ipa)" \
              --notes "Unsigned iOS build of the 3134S crew dashboard wrapper. Sideload with AltStore (or Sideloadly) — AltStore resigns with your own Apple ID and refreshes every 7 days. See README for install steps."
          gh release upload latest SynergyCrew.ipa --clobber --repo "$GITHUB_REPOSITORY"
